global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: learnly-api
    metrics_path: /metrics
    # With METRICS_TOKEN set on the API, add:
    # authorization: { type: Bearer, credentials: "<token>" }
    static_configs:
      - targets: ["api:8000"]
