# Thresholds of the RAG evals (spec 08). A metric below its threshold fails the run
# (exit code 1). `min`: value >= threshold; `max`: value < threshold.
#
# `[full]` is the real bar (OPENAI_API_KEY: real embeddings, LLM and judges).
# `[offline]` applies to `--offline` (FakeEmbeddings + extractive fake LLM): it only
# gates what is meaningful without a model: lexical retrieval and figures. The
# bag-of-words embedder cannot cross languages, so its Recall@5 bar is lower; the
# model-dependent metrics are reported but not gated.

[full]
# faithfulness / citation_precision are RAGAS scores (spec 08), recalibrated on the
# 2026-11-24 baseline (0.881 / 0.853, structural): RAGAS counts claims restating the
# user's situation as unsupported, so it is stricter than the old LLM judge (0.998).
recall_at_5 = 0.90
faithfulness = 0.85
citation_precision = 0.80
correct_abstention = 0.90
correct_figures = 1.0
latency_p95_s = 4.0
poisoned_leaks = 0

[offline]
recall_at_5 = 0.70
correct_figures = 1.0
poisoned_leaks = 0

# Agent evals (spec 13): `python -m app.agent.evals.run [--fake]`. `min`: value >=
# threshold; `max`: value <= threshold. Same bar in both modes: the scripted
# conversations are deterministic, only the model behind them changes.
[agent]
intent_accuracy = 0.95
task_completion = 0.90
unauthorized_tool_calls = 0
