[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "learnly-backend"
version = "0.1.0"
description = "API base with authentication and RBAC"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "email-validator>=2.2.0",
    "fastapi>=0.162.7",
    "langchain-core>=1.8.0",
    "langchain-openai>=1.8.0",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.22",
    "langgraph-checkpoint-postgres>=3.2.1",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.9",
    "pwdlib[argon2]>=0.3.1",
    "redis>=5.0",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn[standard]>=0.54.0",
    "prometheus-client>=0.26.0",
    "opentelemetry-sdk>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b2",
    "langsmith>=0.14.17",
]

[project.scripts]
seed = "app.cli.seed:main"
policies-load = "app.policy.load:main"
payouts-worker = "app.workers.payouts:main"
rag-ingest = "app.rag.ingest:main"

[project.optional-dependencies]
rag-rerank = ["sentence-transformers>=3.0"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.170.15",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ragas>=0.4.4",
    "ruff>=0.17.5",
    "types-pyyaml>=6.0.12.20261113",
]

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # Pyflakes
    "I",  # Import sorting
    "B",  # Bugbear
    "UP", # Pyupgrade
    "N",  # Naming conventions
]

[tool.ruff.lint.per-file-ignores]
# Regex tables and test data read better on one line.
"src/app/agent/guardrails/*.py" = ["E501"]
"tests/**/*.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not live'"
markers = [
    "live: calls the real OpenAI API (excluded by default)",
    "redis: needs a reachable Redis (skipped otherwise)",
]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["app"]
